# Uses the ruff on PATH (brew, 0.15.5). The pre-commit-hooks repo is not used:
# its Python environments fail on the current Homebrew Python (broken pyexpat).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
